# HPA só da API SegPonto (não use como template genérico).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ponto-eletronico-api
  labels:
    app: ponto-eletronico-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ponto-eletronico-api
  minReplicas: 1
  # Teto no nó único (invest/vendas enxutos). Ajuste se mudar o hardware.
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
