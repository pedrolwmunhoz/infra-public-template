apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rate-limit-{FRONT_NAME}
  namespace: default
spec:
  rateLimit:
    # SPA: HTML + CSS/JS/fonts no mesmo ingress; 80/60 estourava no reload.
    average: 300
    burst: 250
    period: 1m
    sourceCriterion:
      ipStrategy:
        depth: 1
